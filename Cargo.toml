[package]
name = "ascii_fluid"
version = "0.1.0"
edition = "2021"
description = "Slow-motion vortex fluid simulation rendered as ASCII, in a pop-out window."

# The standalone window app (the binary) plus a Python-extension library target
# (`ascii_fluid`) exposing the solver to Lore's effects layer via PyO3.
[lib]
name = "ascii_fluid"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features include both x11 and wayland on Linux. If an older cargo
# rejects an edition2024 transitive dep, use:
#   minifb = { version = "0.27", default-features = false, features = ["x11"] }
minifb = "0.27"
font8x8 = "0.3"
pyo3 = { version = "0.25", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
